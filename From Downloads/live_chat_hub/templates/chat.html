<!DOCTYPE html>
<html>
<head>
  <title>Chat</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.0/socket.io.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .chat-container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    #chat p {
      margin: 6px 0;
    }

    .system {
      color: #777;
      font-style: italic;
    }

    .message {
      color: #000;
    }

    input {
      width: 75%;
      padding: 6px;
    }

    button {
      padding: 6px 12px;
    }
  </style>
</head>

<body>

  <div class="chat-container">
    <h2>Live Chat</h2>

    <div id="chat"></div>

    <input id="message" placeholder="Type a message">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>

</body>
</html>
