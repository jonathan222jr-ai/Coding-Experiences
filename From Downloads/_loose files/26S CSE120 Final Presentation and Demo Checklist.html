<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSE 120 Final Presentation Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --card: #ffffff;
  --accent: #1a5276;
  --accent-light: #d4e6f1;
  --gold: #d4a017;
  --gold-light: #fdf2d0;
  --green: #27ae60;
  --green-light: #e8f8f0;
  --red: #c0392b;
  --text: #2c2c2c;
  --text-muted: #7a7a7a;
  --border: #e8e4dc;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

.header {
  background: var(--accent);
  color: white;
  padding: 2.5rem 1.5rem 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -20%;
  width: 140%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 50%, rgba(212,160,23,0.15) 0%, transparent 60%);
  pointer-events: none;
}

.header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.8rem;
  margin-bottom: 0.3rem;
  position: relative;
}

.header p {
  font-size: 0.95rem;
  opacity: 0.85;
  position: relative;
}

.progress-bar-container {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
  font-size: 0.85rem;
  font-weight: 500;
}

.progress-stats .count { color: var(--accent); }
.progress-stats .percent { color: var(--gold); font-weight: 700; }

.progress-track {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  border-radius: 3px;
  width: 0%;
  transition: width 0.4s ease;
}

.container { max-width: 720px; margin: 0 auto; padding: 1rem 1rem 4rem; }

.section {
  background: var(--card);
  border-radius: 12px;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.25rem;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
}

.section-header:hover { background: rgba(0,0,0,0.015); }

.section-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 700;
  font-size: 0.8rem;
  flex-shrink: 0;
}

.section-badge.complete {
  background: var(--green-light);
  color: var(--green);
}

.section-info { flex: 1; min-width: 0; }

.section-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.1rem;
  color: var(--accent);
}

.section-time {
  font-size: 0.78rem;
  color: var(--text-muted);
}

.section-progress-mini {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 600;
  flex-shrink: 0;
}

.section-arrow {
  font-size: 0.9rem;
  color: var(--text-muted);
  transition: transform 0.25s;
  flex-shrink: 0;
}

.section.open .section-arrow { transform: rotate(180deg); }

.section-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}

.section.open .section-body { max-height: 5000px; }

.checklist { padding: 0 1.25rem 1rem; }

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.65rem 0;
  border-bottom: 1px solid rgba(0,0,0,0.04);
}

.check-item:last-child { border-bottom: none; }

.check-box {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: 6px;
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: all 0.2s;
  background: white;
}

.check-box:hover { border-color: var(--accent); }

.check-box.checked {
  background: var(--green);
  border-color: var(--green);
}

.check-box.checked::after {
  content: '✓';
  color: white;
  font-size: 0.75rem;
  font-weight: 700;
}

.check-item.checked .check-label { color: var(--text-muted); text-decoration: line-through; text-decoration-color: rgba(0,0,0,0.15); }

.check-label {
  font-size: 0.88rem;
  line-height: 1.5;
  cursor: pointer;
  transition: color 0.2s;
}

.subsection-title {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--gold);
  padding: 0.75rem 0 0.25rem;
  margin-top: 0.25rem;
}

.note {
  background: var(--gold-light);
  border-left: 3px solid var(--gold);
  padding: 0.6rem 0.8rem;
  font-size: 0.82rem;
  color: #6b5900;
  border-radius: 0 6px 6px 0;
  margin: 0.5rem 0;
  line-height: 1.5;
}

.reset-btn {
  display: block;
  margin: 2rem auto 0;
  padding: 0.6rem 1.5rem;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}

.reset-btn:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <h1>CSE 120 Final Presentation</h1>
  <p>I2G Checklist &mdash; Spring 2026</p>
</div>

<div class="progress-bar-container">
  <div class="progress-stats">
    <span class="count" id="progressCount">0 / 0 items</span>
    <span class="percent" id="progressPercent">0%</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<div class="container" id="app"></div>

<script>
const DATA = [
  {
    title: "Title Slide & File Format",
    time: "Slide 1",
    groups: [
      {
        label: "Title Slide (Slide 1)",
        items: [
          "Project title matches exactly the title provided in the 26S CSE120 Project Summaries.pdf file",
          "Team name appears as the chosen team name followed by the team number in parenthesis using the CSE-3XX format (e.g., 'MyTeamName (CSE-342)')",
          "Project Partner name is listed (e.g., 'Project Partner: ClientName')",
          "All mentor names are listed (e.g., 'Mentor: MentorName')",
          "I2G logo is present in the top-left corner",
          "UC Merced SoE logo is present in the top-right corner"
        ]
      },
    ]
  },
  {
    title: "Part 1: Introduction & Context",
    time: "~3 minutes",
    groups: [
      {
        label: "Team Introduction (Slide 2)",
        items: [
          "Team member names, photos, and roles are listed on the slide",
          "Technical roles are listed first if a member has multiple roles",
          "Contact info (preferably LinkedIn QR code) is included for each member",
          "Keep narration brief — just state your name (role/contact info is on the slide)"
        ]
      },
      {
        label: "Project Partner (Slide 3)",
        items: [
          "Briefly explain who the project partner is and what they do in general",
          "Explain the project partner's business operations as they relate to the project",
          "Do NOT spend time on the project partner's history, successes, or advertise for them"
        ]
      },
      {
        label: "Problem & Motivation (Slide 4)",
        items: [
          "Problem space and context are clearly explained — do not rush this part",
          "Relevant pictures are used to explain the problem and context (REQUIRED)",
          "All lesser-known or industry-specific terms and abbreviations are expanded and explained",
          "Project partner's motivation is established — why the problem is relevant and how the app helps them",
          "Numbers or broader impact are shown if possible (e.g., cost savings, other industries)",
          "Existing solutions discussed and why they are not suitable (if time permits)",
          "Do NOT assume the audience knows your domain terminology"
        ]
      },
      {
        label: "Goals & Requirements (Slide 5)",
        items: [
          "Overarching project goal and desired outcome are presented (big picture, not specifics)",
          "Required features are listed from highest to lowest priority",
          "Bonus features are listed from highest to lowest priority",
          "Delivered features are clearly indicated (e.g., check marks via animation or a second slide)",
          "Check marks appear AFTER presenting the requirements (use animation)",
          "Brief explanation provided for any changed or missing features",
          "Clear connection shown from requirements back to the problem statement"
        ]
      },
      {
        label: "Software Stack (Slide 6)",
        items: [
          "Stack is presented in layers: frontend, logic, backend, database",
          "IDE is NOT included in the software stack",
          "Brief motivation and justification provided for the platform choice",
          "Lesser-known libraries, packages, tools, and services are explained",
          "Do NOT spend much time explaining well-known components (React, Flask, Node, etc.)"
        ]
      }
    ],
    note: "Explain your solution ONLY AFTER introducing the problem, goals, requirements, and delivered features."
  },
  {
    title: "Part 2: Architecture & Demo",
    time: "~5 minutes",
    groups: [
      {
        label: "System Architecture (Slide 7)",
        items: [
          "High-level architecture diagram is included showing how major components are organized",
          "Client-facing layer (what the user interacts with) is depicted",
          "Backend/server layer (application logic, API endpoints) is depicted",
          "Data and storage layer (databases, file storage) is depicted",
          "If using a vision model: show model serving, weight loading, image preprocessing, and postprocessing",
          "If using an LLM: show orchestration layer, prompt construction, context assembly, response parsing, and external LLM API; show RAG pipeline if applicable",
          "Labeled boxes represent each major component",
          "Arrows indicate direction of data flow, labeled where helpful (e.g., HTTP requests, tensors, prompts)",
          "Clearly bounded regions group related parts of the system",
          "Any novelty in the application is depicted and explained in the diagram"
        ]
      },
      {
        label: "Application Data (Slide 8 — if applicable)",
        items: [
          "If data-centric: explain what the input/output data looks like and the information it conveys",
          "If data is provided by the project partner, explain it before the demo using slides",
          "If data is generated/parsed by the app, show it during the demo"
        ]
      },
      {
        label: "Demo Video (Slide 9)",
        items: [
          "Demo video is embedded directly in the presentation (NOT a link — this is a requirement)",
          "Demo video includes closed captions",
          "Video is stretched to span the full slide (no logos/title/footer needed on this slide)",
          "A clear sample workflow is stated at the beginning of the demo",
          "Demo is shown from the perspective of a specific user role (e.g., technician, administrator — NOT generic 'user')",
          "All delivered features from Slide 5 are shown deliberately and not lost to the audience",
          "Inputs/search terms used are meaningful and explained as they are entered",
          "Tables shown on screen: column titles, example rows, and conveyed information are explained",
          "Graphs shown on screen: units and information conveyed are explained",
          "Organization of displayed information is explained if relevant",
          "Main/selling-point features get more time; common features (e.g., login) are kept brief unless core",
          "No personal information visible: browser tabs, bookmarks bar, taskbar/dock, email inbox, wallpaper, or background apps are all hidden",
          "No notifications pop up or sound during the recording",
          "Technical details (code, console) are clearly separated from the user-facing workflow and prefaced with narration explaining the difference (if shown)",
          "Speaker's face or name overlay is shown during the demo (recommended for engagement)"
        ]
      }
    ],
    note: "Keep the audience's perspective in mind — they are seeing this for the first time. Explain everything shown on screen, even briefly."
  },
  {
    title: "Part 3: Challenges & Future",
    time: "~3.5 minutes",
    groups: [
      {
        label: "Technical Challenges & Solutions (Slide 10)",
        items: [
          "One or more specific and significant technical challenges are presented",
          "Each challenge is immediately followed by how the team resolved it before moving to the next",
          "Challenges are genuinely technical (NOT merge conflicts, refactoring from poor decisions, or lack of experience/knowledge)",
          "Feature creep due to project partner miscommunication is NOT presented as a technical challenge",
          "Design patterns or design revisions are discussed if relevant"
        ]
      },
      {
        label: "Team Challenges & Solutions (Slide 11)",
        items: [
          "One or more team/collaboration challenges are presented",
          "Each challenge is immediately followed by how the team resolved it",
          "Challenges cover relevant factors: division of labor, coordination, communication, decision making, conflict resolution, accountability, time management, etc."
        ]
      },
      {
        label: "Team Successes (Slide 12)",
        items: [
          "One or more aspects that worked well are presented",
          "Successes cover relevant factors: communication, knowledge sharing, coordination strategies, mentor communication, team cohesion, leadership, etc."
        ]
      },
      {
        label: "Future Work (Slide 13)",
        items: [
          "Short-term goals (1 month / 1 iteration) are presented: missing features, polishing, deployment, production readiness",
          "Long-term goals (2–3 months / more iterations) are presented: complex features, new features beyond project partner requirements, broader industry applications, startup/market readiness"
        ]
      }
    ]
  },
  {
    title: "Part 4: Conclusion",
    time: "~0.5 minutes",
    groups: [
      {
        label: "Conclusion (Slide 14)",
        items: [
          "Explain why the project partner will want to use the application — what makes it stand out",
          "Highlight standout qualities: extensibility, scalability, industry-standard tech, responsive UI, cost-effectiveness, security, robustness, testing, documentation, etc.",
          "Address competing off-the-shelf products and how your product wins against them",
          "Discuss how the application can be applied to other industry sectors",
          "End with a call to action — invite the audience to connect, discuss future development, or explore opportunities",
          "Do NOT abruptly end with just 'Thank you, any questions?' — wrap up with your team name and impact statement"
        ]
      },
      {
        label: "Closing Slide (Slide 15)",
        items: [
          "Final slide includes project title, team name with team number in parenthesis in CSE-3XX format, project partner, and mentor(s)",
          "All team members listed again with roles and contact info (LinkedIn QR codes)"
        ]
      }
    ]
  },
  {
    title: "Formatting & Slide Requirements",
    time: "All slides",
    groups: [
      {
        label: "Slide Template Compliance",
        items: [
          "Presentation file is in .pptx format (PowerPoint)",
          "I2G logo appears on each page (except the demo slide)",
          "UC Merced SoE logo appears on each page (except the demo slide)",
          "Footer on each page: 'TeamName (CSE-3XX) | Project Title | ProjectPartnerName'",
          "Slide number on each page",
          "Title slide uses format: TeamName (CSE-3XX) where XX is your specific team number",
          "Presentation is 12 minutes MAX"
        ]
      },
      {
        label: "General Quality",
        items: [
          "Slides are not too sparse or too dense — information is displayed, not just spoken",
          "Specific user roles are used instead of generic terms like 'user', 'customer', or 'client'",
          "Gender-neutral pronouns are used (they/them or she/her)",
          "Novelty of the solution is highlighted throughout the presentation where relevant (not just at the end)",
          "Algorithms, models, or databases used are clearly explained with slides, images, or diagrams",
          "Tone is professional and energetic — the team sounds excited about what they built",
          "File naming convention follows the instructions in the 26S CSE120 I2G Deliverable Details and File Upload.pdf document"
        ]
      }
    ]
  }
];

let checks = {};

function init() {
  const saved = null; // no localStorage
  const app = document.getElementById('app');
  let totalItems = 0;

  DATA.forEach((section, si) => {
    const div = document.createElement('div');
    div.className = 'section open';
    div.dataset.section = si;

    let itemsHtml = '';
    let sectionItemCount = 0;
    section.groups.forEach((group, gi) => {
      itemsHtml += `<div class="subsection-title">${group.label}</div>`;
      group.items.forEach((item, ii) => {
        const key = `${si}-${gi}-${ii}`;
        checks[key] = false;
        sectionItemCount++;
        totalItems++;
        itemsHtml += `
          <div class="check-item" data-key="${key}">
            <div class="check-box" onclick="toggle('${key}')"></div>
            <div class="check-label" onclick="toggle('${key}')">${item}</div>
          </div>`;
      });
    });

    if (section.note) {
      itemsHtml += `<div class="note">${section.note}</div>`;
    }

    div.innerHTML = `
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-badge" data-section="${si}">${sectionItemCount}</div>
        <div class="section-info">
          <div class="section-title">${section.title}</div>
          <div class="section-time">${section.time}</div>
        </div>
        <div class="section-progress-mini" data-section-progress="${si}">0/${sectionItemCount}</div>
        <div class="section-arrow">▼</div>
      </div>
      <div class="section-body">
        <div class="checklist">${itemsHtml}</div>
      </div>`;

    app.appendChild(div);
  });

  app.innerHTML += `<button class="reset-btn" onclick="resetAll()">Reset all checkmarks</button>`;
  updateProgress();
}

function toggle(key) {
  checks[key] = !checks[key];
  const item = document.querySelector(`[data-key="${key}"]`);
  const box = item.querySelector('.check-box');
  if (checks[key]) {
    item.classList.add('checked');
    box.classList.add('checked');
  } else {
    item.classList.remove('checked');
    box.classList.remove('checked');
  }
  updateProgress();
}

function toggleSection(header) {
  header.parentElement.classList.toggle('open');
}

function updateProgress() {
  const total = Object.keys(checks).length;
  const done = Object.values(checks).filter(Boolean).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('progressCount').textContent = `${done} / ${total} items`;
  document.getElementById('progressPercent').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = `${pct}%`;

  // Update section badges and progress
  const sectionCounts = {};
  Object.entries(checks).forEach(([key, val]) => {
    const si = key.split('-')[0];
    if (!sectionCounts[si]) sectionCounts[si] = { total: 0, done: 0 };
    sectionCounts[si].total++;
    if (val) sectionCounts[si].done++;
  });

  Object.entries(sectionCounts).forEach(([si, c]) => {
    const badge = document.querySelector(`.section-badge[data-section="${si}"]`);
    const prog = document.querySelector(`[data-section-progress="${si}"]`);
    if (c.done === c.total) {
      badge.classList.add('complete');
      badge.textContent = '✓';
    } else {
      badge.classList.remove('complete');
      badge.textContent = c.total - c.done;
    }
    prog.textContent = `${c.done}/${c.total}`;
  });
}

function resetAll() {
  if (!confirm('Reset all checkmarks?')) return;
  Object.keys(checks).forEach(k => checks[k] = false);
  document.querySelectorAll('.check-item').forEach(el => el.classList.remove('checked'));
  document.querySelectorAll('.check-box').forEach(el => el.classList.remove('checked'));
  updateProgress();
}

init();
</script>
</body>
</html>
