<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Dashboard — Hogwarts</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

  <div class="header">
    <h2>Teacher Dashboard — {{ current_user.username }}</h2>
    <nav>
      <a href="{{ url_for('logout') }}">Sign Out</a>
    </nav>
  </div>

  <h3>My Classes</h3>

  <div class="course-grid">
    {% for c in courses %}
      <div class="course-card">
        <h4>{{ c.name }}</h4>
        <p><strong>Time:</strong> {{ c.time }}</p>
        <p><strong>Enrolled:</strong> {{ c.enrollments | length }}/{{ c.capacity }}</p>
        <a href="{{ url_for('teacher_course', course_id=c.id) }}" class="magic-btn">View Students</a>
      </div>
    {% endfor %}
  </div>

</div>
</body>
</html>
